Fixed, verified, and shipped. Here's the full picture:

Root cause (three real defects, all in the shipped kit)
1. flekjit-project.patch shipped a corrupted project.pbxproj. My patch generator searched for the Embed-Frameworks files = ( line with the wrong indentation (find() → -1, no assert), then spliced the embed entry at index 12 — the middle of the // !$*UTF8*$! magic header. Every "clean" application of the patch produced a pbxproj whose first lines were garbage — exactly what xcodebuild reports as "The project 'LiveContainer' is not a valid property list". Two more latent bugs rode along: a duplicate object ID (F1EC0DE1305600000A000009 used as both a build-file and the LoopbackVPN Debug config) and the embed entry never landing in its phase.

2. The workflow's already-patched gates were broken. They grepped LCSettingsView.swift for all four patches' markers — but core adds FlekBuiltInJITSection to that file as part of its own hunk, so the ui patch was silently skipped on every pristine fork, and the vpn/project gates checked files their markers never appear in.

3. The -C1 fallback could mask corruption. A failed --3way (swallowed by >/dev/null) followed by -C1 could exit 0 on a marker-laden tree — silent corruption instead of a loud failure.

What I fixed
Rebuilt the project patch — repaired the work-tree pbxproj (header restored, embed entry relocated into its phase, duplicate ID re-issued to ...000E), amended the commit, re-cut the patch. Graph audit: 212 unique object IDs, zero dangling refs, valid OpenStep plist.
Rewrote the apply chain: core+project gate on marker lines only they add (case BuiltIn = 7, StikJITHeadless in the pbxproj); ui/vpn gate on files they create. No -C1. --3way with visible stderr. fetch-depth: 0 so the merge always has its blobs. Plus two guards before anything touches the tree: a conflict-marker sweep and plutil -lint project.pbxproj.
Verified across 9 fork scenarios (pristine/drifted/shallow/overlapping-drift/already-ported/both vendored layouts): every path now yields either a clean valid pbxproj or a loud, actionable failure.
To fix your LiveContainer-jitter fork
Your fork already carries the corrupted patch result, so on your machine:

Grab the new kit: lc-flekjit-kit.zip (or build-flekjit.yml standalone).
Restore the corrupted files to pristine upstream in your fork:
sh
git checkout upstream/main -- LiveContainer.xcodeproj IdevicePairing StikJITHeadless
(or git revert your ported commit if the fork has one), then commit the new patches/ + workflow and re-run Actions → Build FlekJIT fork. If you'd moved vendored/ to the root, that layout now also applies cleanly via 3-way no-op — no need to undo it.
Updated deliverables: LiveContainer-FlekJIT-Fork-Guide.docx / .pdf (CI section, Upgrading and Troubleshooting rewritten to match the new chain), and the kit's README. The verification scripts (sim_layouts.sh, repair_project_patch.py, audit_pb_graph.py etc.) are under scripts/ if you want to re-run any of it.

